<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191633"/>
      <stop offset="100%" stop-color="#0d0c18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7bff"/>
      <stop offset="100%" stop-color="#ff5ea8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Rabbit ears -->
  <ellipse cx="192" cy="148" rx="34" ry="86" transform="rotate(-12 192 148)" fill="url(#neon)"/>
  <ellipse cx="320" cy="148" rx="34" ry="86" transform="rotate(12 320 148)" fill="url(#neon)"/>
  <ellipse cx="192" cy="154" rx="16" ry="54" transform="rotate(-12 192 154)" fill="#181530"/>
  <ellipse cx="320" cy="154" rx="16" ry="54" transform="rotate(12 320 154)" fill="#181530"/>
  <!-- Headphone ring + face -->
  <circle cx="256" cy="296" r="120" fill="#1e1b3a" stroke="url(#neon)" stroke-width="18"/>
  <!-- Play triangle -->
  <polygon points="228,244 228,348 318,296" fill="#ffffff"/>
</svg>
